# Linux: Ollama as a Compose service (no Metal to lose).
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama-data:
